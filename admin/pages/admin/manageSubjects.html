<div class="page-header-dynamic"><h1 class="page-title">Manage & Upload Subjects</h1></div>
<div class="filter-card">
  <div class="filter-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
    <div><label class="form-label">Year</label><select class="form-select" id="filter-year"></select></div>
    <div><label class="form-label">Department</label><select class="form-select" id="filter-department"></select></div>
    <div><label class="form-label">Subject Code</label><select class="form-select" id="filter-subject-code">
  <option value="">All Codes</option>
  </select></div>
  </div>
  <div class="filter-buttons">
    <button id="subject-apply-filter-btn" class="btn-primary" type="button">Apply Filter</button>
    <button id="subject-clear-filter-btn" class="btn-secondary" type="button">Clear Filter</button>
    <button id="show-master-upload-btn" class="btn-secondary" type="button">
       <span class="material-symbols-outlined" style="margin-right: 0.5rem;">upload</span>
      Bulk Upload
    </button>
  </div>
</div>

<div id="master-upload-section" class="content-card" style="margin-top: 2rem; display:none;">
  <h3>Bulk Upload Master Subject List</h3>
  <p>Column headers must be: <strong>'department', 'year', 'subjectCode', 'subjectName'</strong>.</p>
  <div class="action-bar" style="border-top: none; padding-top: 1rem;">
      <button id="download-master-template-btn" class="btn-secondary">Download Format</button>
      <div class="filter-buttons" style="align-items: center; gap: 0.5rem;">
          <input class="form-input" id="master-subject-upload" type="file" accept=".xlsx"/>
          <button class="btn-primary" id="upload-master-list-btn" type="button">Upload</button>
      </div>
  </div>
</div>

<div class="table-section" style="margin-top: 2rem;">
  <div class="table-overflow">
    <table class="data-table">
      <thead>
        <tr>
            <th class="col-short">S.No</th>
            <th class="col-short">Year</th>
            <th class="col-medium">Department</th>
            <th class="col-medium">Subject Code</th>
            <th>Subject Name</th>
            <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody id="subjects-table-body"></tbody>
    </table>
  </div>
</div>
