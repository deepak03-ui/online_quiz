<div class="page-header-dynamic"><h1 class="page-title">Manage Coordinators</h1></div>
<div class="filter-card">
  <div class="filter-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
    <div><label class="form-label">Name</label><input class="form-input" id="coord-filter-name" placeholder="Filter by name..." type="text"/></div>
    <div><label class="form-label">Email</label><input class="form-input" id="coord-filter-email" placeholder="Filter by email..." type="email"/></div>
    <div><label class="form-label">Department</label><select class="form-select" id="coord-filter-department"></select></div>
    <div><label class="form-label">Year</label><select class="form-select" id="coord-filter-year"></select></div>
  </div>
  <div class="filter-buttons">
    <button id="coord-apply-filter-btn" class="btn-primary">Apply Filter</button>
    <button id="coord-clear-filter-btn" class="btn-secondary">Clear Filter</button>
    <button id="show-coord-upload-section-btn" class="btn-secondary" type="button">
       <span class="material-symbols-outlined" style="margin-right: 0.5rem;">upload</span> Bulk Upload
    </button>
    <button id="add-coord-btn" class="btn-primary" style="margin-left: auto;">
      <span class="material-icons add-icon" style="margin-right: 0.5rem;">add</span>Add Coordinator
    </button>
  </div>
</div>
<div id="coord-bulk-upload-section" class="content-card" style="margin-top: 2rem; display:none;">
  <h3>Bulk Upload Coordinators</h3>
  <p>Column headers must be: <strong>name, email, department, year</strong>.</p>
  <div class="action-bar" style="border-top: none; padding-top: 1rem;">
      <button id="download-coord-template-btn" class="btn-secondary">Download Format</button>
      <div class="filter-buttons" style="align-items: center; gap: 0.5rem;">
          <input class="form-input" id="coord-file-upload" type="file" accept=".xlsx"/>
          <button class="btn-primary" id="coord-upload-button" type="button">Upload</button>
      </div>
  </div>
</div>
<div class="table-section" style="margin-top: 2rem;">
  
  <div class="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
    <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;"> <div class="filter-item">
          <label for="coord-page-size-select">Show Entries:</label>
          <select id="coord-page-size-select" class="filter-select">
              <option value="25">25</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
          </select>
      </div>
      <div class="page-navigation">
          <button id="coord-prev-btn" class="btn-secondary">Previous</button>
          <span id="coord-page-info">Page 1</span>
          <button id="coord-next-btn" class="btn-secondary">Next</button>
      </div>
    </div>
    
    
      
  </div>
  
  <div class="table-overflow">
    <table class="data-table">
      <thead><tr><th>S.No</th><th>Name</th><th>Email</th><th>Department</th><th>Year</th><th>Actions</th></tr></thead>
      <tbody id="coordinators-table-body"></tbody>
    </table>
  </div>
</div>
