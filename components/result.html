<!-- result.html - Results dashboard -->
<div class="card">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h2 class="text-2xl font-bold text-navy">Results</h2>
      <p class="text-sm text-gray-500">Overview and history of your test performances.</p>
    </div>
  </div>

  <div class="results-grid mb-4">
    <div class="card p-4">
      <div class="text-sm text-gray-500">Tests Completed</div>
      <div id="results-completed" class="text-2xl font-bold text-navy">0</div>
    </div>
    <div class="card p-4">
      <div class="text-sm text-gray-500">Average Score</div>
      <div id="results-avg" class="text-2xl font-bold text-navy">0%</div>
    </div>
  </div>

  <div class="table-container">
    <div class="table-header">Test History</div>
    <div class="table-scroll">
      <table class="w-full">
        <thead>
          <tr><th>Test</th><th>Date</th><th>Score</th><th>Status</th></tr>
        </thead>
        <tbody id="results-table-body">
          <tr><td colspan="4" class="text-gray-500 p-4">No results yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-4 card">
    <div class="text-gray-600"></div>
    <div id="performance-chart" style="height:220px" class="mt-3 flex items-center justify-center text-gray-400"></div>
  </div>
</div>

<script>
  function renderResultsData(data) {
    const tests = data.tests || [];
    document.getElementById('results-completed').textContent = tests.length;
    
    // Calculate average score only from completed tests with a valid score
    const completedTests = tests.filter(t => t.rawStatus === 'completed' && t.score != null);
    const avg = completedTests.length > 0
      ? Math.round(completedTests.reduce((sum, t) => sum + parseFloat(t.score), 0) / completedTests.length)
      : 0;
    document.getElementById('results-avg').textContent = avg + '%';

    const tbody = document.getElementById('results-table-body');
    tbody.innerHTML = '';
    if (tests.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-gray-500 p-4">No results yet.</td></tr>';
      return;
    }

    // Sort tests by date, most recent first
    tests.sort((a, b) => new Date(b.date) - new Date(a.date));

    tests.forEach(t => {
      const tr = document.createElement('tr');
      
      let statusClass = 'bg-yellow-100 text-yellow-800'; // Default for 'In Progress'
      if (t.status === 'Pass') {
        statusClass = 'bg-green-100 text-green-800';
      } else if (t.status === 'Fail') {
        statusClass = 'bg-red-100 text-red-800';
      }

      tr.innerHTML = `
        <td>${t.title}</td>
        <td>${t.date || '—'}</td>
        <td>${t.score != null ? t.score + '%' : '—'}</td>
        <td><span class="px-2 py-1 rounded text-xs font-medium ${statusClass}">${t.status || 'Completed'}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>
