<!-- profile.html - Profile section component -->
<div class="card">
  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
    <div class="flex flex-col items-center">
      <img id="profile-photo" alt="Student Photo" class="profile-photo mb-3">
      <div class="text-center">
        <h3 id="profile-fullname" class="text-lg font-bold">Student Name</h3>
        <div id="profile-roll" class="text-gray-600">Roll No</div>
      </div>
    </div>
    <div class="lg:col-span-3 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-semibold text-gray-500 uppercase">Email</label>
          <div class="mt-1 field-container"><span id="profile-email" class="font-medium"></span></div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500 uppercase">Roll Number</label>
          <div class="mt-1 field-container"><span id="profile-roll2" class="font-medium"></span></div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-semibold text-gray-500 uppercase">Department</label>
          <div class="mt-1 field-container"><span id="profile-dept" class="font-medium"></span></div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500 uppercase">Year & Section</label>
          <div class="mt-1 field-container"><span id="profile-yearsect" class="font-medium"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Exposes renderProfileData(profile) to be called by the main loader
  function renderProfileData(profile) {
    if (!profile) return;
    document.getElementById('profile-fullname').textContent = profile.fullName || profile.name || 'Student';
    document.getElementById('profile-roll').textContent = profile.rollNo || profile.regNo || '';
    document.getElementById('profile-email').textContent = profile.email || '';
    document.getElementById('profile-roll2').textContent = profile.rollNo || profile.regNo || '';
    document.getElementById('profile-dept').textContent = profile.department || '';
    document.getElementById('profile-yearsect').textContent = (profile.year ? profile.year : '') + (profile.section ? (' - Sec ' + profile.section) : '');
    // photo
    
  }
</script>

<style>
  /* minimal component-level adjustments */
  .field-container{background:linear-gradient(135deg,#f8fafc,#f1f5f9);padding:.75rem;border-radius:10px;border-left:4px solid #1e3a8a;}
</style>
