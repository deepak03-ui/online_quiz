<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEC Admin Portal - Administrator Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        /* Define PEC Colors */
        :root { --pec-navy: #1C3A5A; --pec-orange: #FF7F50; }
        .bg-pec-navy { background-color: var(--pec-navy); }
        .text-pec-orange { color: var(--pec-orange); }
        /* Navigation Styles */
        .nav-link { 
            display: flex; align-items: center; padding: 10px 15px; border-radius: 8px;
            color: #ccc; transition: all 0.2s; gap: 10px; font-weight: 500;
        }
        .nav-link:hover { background-color: rgba(255, 127, 80, 0.1); color: var(--pec-orange); }
        .nav-link.active { background-color: var(--pec-orange); color: white; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex h-screen">

        <aside id="sidebar-container" class="w-64 bg-pec-navy shadow-2xl transition-transform duration-300 ease-in-out p-4 flex flex-col justify-between">
            <div>
                <div class="text-white text-xl font-bold mb-6 border-b border-gray-700 pb-4">PEC Admin</div>
                <div id="admin-sidebar-nav" class="space-y-2">
                    <p class="text-gray-400 text-sm p-4">Loading Navigation...</p>
                </div>
            </div>
            
            <div id="user-profile-summary" class="text-white pt-4 border-t border-gray-700">
                <p id="user-display-name" class="font-semibold text-sm">Loading...</p>
                <p id="user-role-display" class="text-xs text-gray-400">Loading Role...</p>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-8">
            <header class="pb-6 border-b border-gray-200 mb-6 flex justify-between items-center">
                <h1 id="page-title" class="text-3xl font-bold text-gray-800">Administrator Dashboard</h1>
                <button id="sign-out-btn" class="text-red-500 hover:text-red-700 flex items-center gap-1 font-semibold">
                    <span class="material-symbols-outlined text-lg">logout</span>
                    Sign Out
                </button>
            </header>
            
            <section id="dynamic-content-area" class="space-y-6">
                <div class="text-center py-20 text-gray-500">
                    <p>Initializing dashboard content...</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="./js/admin-ui.js"></script>
</body>
</html>
