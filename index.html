<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEC Test Portal | Login</title>
    
    <link rel="stylesheet" href="styles.css"> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="background-pattern" aria-hidden="true"></div>
    
    <header class="top-bar" role="banner" aria-label="Panimalar Engineering College Header">
        <div class="top-bar-inner">
            
                <figure class="brand">
                    <img src="./images/panimalar_logo.png" alt="College Logo" class="college-logo">
                   <div class="brand-text">
                        <div class="college-name">PANIMALAR ENGINEERING COLLEGE</div>
                        <div class="sub-name1"><b>JAISAKTHI EDUCATIONAL TRUST</b></div>
                        <div class="sub-name2">AN AUTONOMOUS INSTITUTION</div>
                    </div>
         
                </figure>
            
            
            <img src="./images/25years_logo.jpeg" alt="25th Anniversary Celebration" class="secondary-logo-img" aria-hidden="true">
        </div>
    </header>



<main class="main-content">
    <div class="decorative-circle circle-1"></div>
    <div class="decorative-circle circle-2"></div>
    <div class="decorative-circle circle-3"></div>
    
    <section id="login-view" class="view-container">
      <div class="login-card">
        <div class="card-header">
          
          <h1 class="platform-title">PEC</h1>
          <h1 class="platform-title">Test Portal Login</h1>
          <p class="platform-subtitle1">Commitment to Academic Excellence.</p>
          <p class="platform-subtitle">Please sign in with your registered Gmail account</p>
         
        </div>
        
        <div class="card-body">
          <button id="google-signin-btn" class="signin-button">
            <div class="button-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
            </div>
            <span>Sign In with Google</span>
            <div class="button-shimmer"></div>
          </button>
          
          <p id="auth-error-message" class="error-message">Sign-in process was cancelled.</p>
        </div>
        
        <div class="card-footer">
                    <div class="security-badge">
                        <i class="fas fa-shield-alt badge-icon"></i>
                        <span>Secure Authentication</span>
                    </div>
                </div>
      </div>
    </section>

    
  </main>

  
    <footer class="site-footer">
        <p class="powered-by">
        <i class="fas fa-microchip"></i>
        Powered by Department of Artificial Intelligence and Data Science, All Rights Reserved. 
        
    </p>  
      
        <p class="company-details">
           
            <i class="fas fa-envelope"></i> pecaidsonlineportal@gmail.com
        </p>
    </footer>

    <script src="./login.js" type="module"></script>
    </body>
</html>
